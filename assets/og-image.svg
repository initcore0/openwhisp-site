<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#11151E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#3DD8E0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3DD8E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.12" r="0.45">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- waveform: tall in the middle, tapering out (matches the app icon) -->
  <g transform="translate(600,196)" fill="#E8ECF2" filter="url(#soft)">
    <rect x="-198" y="-12" width="9" height="24"  rx="4.5"/>
    <rect x="-168" y="-30" width="9" height="60"  rx="4.5"/>
    <rect x="-138" y="-52" width="9" height="104" rx="4.5"/>
    <rect x="-108" y="-72" width="9" height="144" rx="4.5"/>
    <rect x="-78"  y="-92" width="9" height="184" rx="4.5" fill="#3DD8E0"/>
    <rect x="-48"  y="-104" width="9" height="208" rx="4.5" fill="#3DD8E0"/>
    <rect x="-18"  y="-112" width="9" height="224" rx="4.5" fill="#E8ECF2"/>
    <rect x="12"   y="-104" width="9" height="208" rx="4.5" fill="#3DD8E0"/>
    <rect x="42"   y="-90"  width="9" height="180" rx="4.5" fill="#3DD8E0"/>
    <rect x="72"   y="-66"  width="9" height="132" rx="4.5"/>
    <rect x="102"  y="-46"  width="9" height="92"  rx="4.5"/>
    <rect x="132"  y="-28"  width="9" height="56"  rx="4.5"/>
    <rect x="162"  y="-14"  width="9" height="28"  rx="4.5"/>
    <rect x="189"  y="-9"   width="8" height="18"  rx="4"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="368" text-anchor="middle"
        font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="6"
        fill="#3DD8E0">LOCAL-FIRST DICTATION FOR macOS</text>

  <!-- headline -->
  <text x="600" y="446" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="62"
        fill="#E8ECF2">Speak. It&#8217;s typed.</text>
  <text x="600" y="520" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="62"
        fill="#3DD8E0">Nothing leaves your Mac.</text>

  <!-- wordmark -->
  <text x="600" y="588" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="26"
        fill="#8A93A6">OpenWhisp &#183; open source &#183; macOS</text>
</svg>
