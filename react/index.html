              "@type": "Question",
              "name": "Does my audio ever leave my Mac?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Transcription runs entirely on your Mac and works offline. Audio is never uploaded, and the recording is deleted after each transcription. The only time any text leaves your machine is if you explicitly choose the optional OpenAI provider for AI cleanup."
              }
            },
            {
              "@type": "Question",
              "name": "How much does OpenWhisp cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nothing. OpenWhisp is free and open source under the MIT license — no account, no subscription, no usage meter."
              }
            },
            {
              "@type": "Question",
              "name": "What are the system requirements?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "An Apple Silicon Mac (M1 or newer) running macOS 14 Sonoma or later."
              }
            },
            {
              "@type": "Question",
              "name": "How is it different from the built-in macOS dictation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "OpenWhisp runs Whisper-class models for noticeably better accuracy, and adds things macOS dictation doesn't have: voice editing of selected text, AI refinement that runs offline, custom vocabulary, per-app modes, and a searchable local history."
              }
            },
            {
              "@type": "Question",
              "name": "Why does macOS warn me on first launch?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The downloadable build is ad-hoc signed rather than notarized. Right-click OpenWhisp.app and choose Open once to confirm — or build it yourself from source."

            }
          ]
