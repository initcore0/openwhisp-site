              "@type": "Question",
              "name": "Does my audio ever leave my Mac?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Transcription runs entirely on your Mac and works offline. Audio is never uploaded, and the recording is deleted after each transcription. The only time any text leaves your machine is if you explicitly choose the optional OpenAI provider for AI cleanup."
              }
            },
            {
              "@type": "Question",
              "name": "How much does OpenWhisp cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nothing. OpenWhisp is free and open source under the MIT license — no account, no subscription, no usage meter."
              }
            },
            {
              "@type": "Question",
              "name": "What are the system requirements?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "An Apple Silicon Mac (M1 or newer) running macOS 14 Sonoma or later."
              }
            },
            {
              "@type": "Question",
              "name": "How is it different from the built-in macOS dictation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "OpenWhisp streams words in about 0.3 seconds behind your voice, already punctuated, and adds things macOS dictation doesn't have: voice editing of selected text, AI refinement that runs offline, custom vocabulary, per-app modes, a searchable local history, and a built-in MCP server so AI coding agents can use your voice."
              }
            },
            {
              "@type": "Question",
              "name": "Can AI coding agents like Claude Code use OpenWhisp?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. OpenWhisp doubles as a local MCP server, so Claude Code, Cursor, and any MCP-aware agent can ask you questions out loud and take your spoken answer, rewrite text with your on-device model, and read your recent dictations. It works with any API key or Bedrock setup, over SSH, and in regulated environments, because nothing is ever sent to the cloud. It is off until you enable it, and you approve each agent and each capability."
              }
            },
            {
              "@type": "Question",
              "name": "How do I install OpenWhisp?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Download the DMG, drag OpenWhisp to your Applications folder, and open it. The build is signed and notarized by Apple, so it launches with a double-click — no Gatekeeper prompts. You can also build it yourself from source."
              }
            }
